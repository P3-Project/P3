spring.application.name=backend
spring.docker.compose.file=../../../compose.yaml

# Close the DB connection after each request (recommended for REST APIs)
spring.jpa.open-in-view=false

# Flyway creates tables, Hibernate only checks they match your Java classes
spring.jpa.hibernate.ddl-auto=validate

# Send our Danish error messages ("Moro er udsolgt", "Bord 3 har allerede en åben ordre") to the frontend
server.error.include-message=always