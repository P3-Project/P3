<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waiter - PPSH</title>
    <link rel="stylesheet" href="../CSS/styles.css"/>
    <link rel="stylesheet" href="../CSS/waiter.css"/>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Waiter</div>
      <div id="clock"></div>
    </header>
    <section class="orderbar">
      <div class="orderbar-left">
        <h1 id="table-title">Table 7</h1>
        <button id="change-table-btn" class="order-number">Change Table</button>
      </div>
    </section>
    <main class="layout">
      <section class="menu">
        <div id="categories" class="categories"></div>
        <div id="menu-grid" class="menu-grid"></div>
      </section>

      <aside class="order">
        <div class="order-header">
          <span>Item</span> <span>Qty</span> <span>Remove</span>
        </div>
        <div id="order-lines" class="order-lines"></div>
        <div class="order-footer">
          <div class="total">
            <span>Total</span><span id="total">0 kr</span>
          </div>
          <div class="actions">
            <button id="cancel-btn" class="btn-btn-danger">Cancel order</button>
            <button id="send-btn" class="btn-btn-primary">
              Send to kitchen
            </button>
          </div>
        </div>
      </aside>
    </main>
  </body>
</html>
